name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-natives:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64, lib: libnovelua.so }
          - { os: macos-latest, name: macos-arm64, lib: libnovelua.dylib }
          - { os: windows-latest, name: windows-x64, lib: novelua.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.x'

      - name: Build & Run Tests
        run: ./gradlew compileNatives test --info

      - name: Upload Matrix Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelua-native-${{ matrix.name }}
          path: build/novelua/${{ matrix.lib }}

  publish-release:
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts

      - name: Package Release
        run: |
          mkdir -p release-dist
          find build/artifacts/ -type f -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
