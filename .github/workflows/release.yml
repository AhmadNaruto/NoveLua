name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-natives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.x'

      - name: Build Native Library (Android ARM64)
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release \
                -B build-android \
                -S .
          cmake --build build-android
          mkdir -p build/novelua
          cp build-android/src/main/cpp/luau/libnovelua.so build/novelua/

      - name: Build & Run Host Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android Library (AAR)
        run: ./gradlew assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelua-native-android-arm64
          path: build/novelua/libnovelua.so

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelua-aar
          path: build/outputs/aar/novelua-release.aar


  publish-release:
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts

      - name: Package Release
        run: |
          mkdir -p release-dist
          find build/artifacts/ -type f -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
