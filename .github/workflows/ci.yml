name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache CMake
      uses: actions/cache@v4
      with:
        path: |
          **/.cxx
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Inject -Werror
      run: |
        find modules -name "build.gradle.kts" -exec sed -i 's/cppFlags += "-std=c++20"/cppFlags += "-std=c++20 -Werror"/g' {} +
        find modules -name "build.gradle.kts" -exec sed -i 's/cFlags += "-std=c17"/cFlags += "-std=c17 -Werror"/g' {} +
        find modules -name "build.gradle.kts" -exec sed -i 's/kotlinOptions {/kotlinOptions {\n        allWarningsAsErrors = true/g' {} +

    - name: Build Modules
      run: ./gradlew assembleRelease --no-daemon

    - name: Run Tests
      run: ./gradlew test --no-daemon
